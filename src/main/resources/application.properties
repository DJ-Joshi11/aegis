spring.application.name=aegis

# H2 in-memory database — no setup required, resets on every restart.
# Swap to Postgres later by changing these 4 lines if the team wants persistence.
spring.datasource.url=jdbc:h2:mem:aegis;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console at /h2-console — handy for checking what's actually in the DB while building
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Live template reload while developing
spring.thymeleaf.cache=false

# ${PORT:8080} — most cloud hosts (Render, Railway, etc.) inject a PORT env
# var and expect the app to bind to it; falls back to 8080 for local runs.
server.port=${PORT:8080}

# ---- Mock Qusar feed -------------------------------------------------------
# Decisions back-filled at startup so the insights page has history to analyse
# (H2 is in-memory, so this runs again after every restart / redeploy).
aegis.ingestion.backfill-count=320
aegis.ingestion.backfill-hours=72
# Fixed random seed so the back-filled demo history is identical on every restart.
aegis.ingestion.seed=3

# ---- Insights engine (analytics layer, /insights) ---------------------------
aegis.insights.min-sample=12
aegis.insights.alpha=0.01
aegis.insights.review-minutes-per-case=15
aegis.insights.impact-ratio-threshold=0.8
aegis.insights.psi-threshold=0.25
aegis.insights.low-confidence-threshold=0.6
# Demo stand-in for human reviewers; set false when real verdicts are posted.
aegis.insights.simulated-reviewer=true
aegis.insights.sim-review-delay-seconds=90
