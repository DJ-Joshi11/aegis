spring.application.name=aegis

# H2 in-memory database — no setup required, resets on every restart.
# Swap to Postgres later by changing these 4 lines if the team wants persistence.
spring.datasource.url=jdbc:h2:mem:aegis;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console at /h2-console — handy for checking what's actually in the DB while building
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Live template reload while developing
spring.thymeleaf.cache=false

server.port=8080
